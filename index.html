<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>🌈 早安学习乐园</title>
<style>
  :root{
    --pink:#FFB3D9; --blue:#A0D8FF; --yellow:#FFE680; --green:#B5EAD7; --purple:#D7B3FF;
    --pink-d:#FF8FC4; --blue-d:#6FC3FF; --yellow-d:#FFD23F; --green-d:#7FDDB0; --purple-d:#B98CFF;
    --ink:#5b4a63; --card:#ffffff; --bg1:#fff0f7; --bg2:#eef6ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; color:var(--ink);}
  body{background:linear-gradient(135deg,var(--bg1),var(--bg2)); min-height:100vh; font-size:16px; padding-bottom:env(safe-area-inset-bottom);}
  .sidebar{position:fixed; top:0; left:0; bottom:0; width:210px; background:rgba(255,255,255,.75); backdrop-filter:blur(8px); padding:18px 12px; display:flex; flex-direction:column; gap:6px; z-index:30; box-shadow:2px 0 16px rgba(180,150,200,.15);}
  .brand{font-size:20px; font-weight:800; text-align:center; margin:6px 0 14px; line-height:1.2;}
  .brand small{display:block; font-size:11px; font-weight:600; color:#a98fb5;}
  .nav-btn{display:flex; align-items:center; gap:10px; padding:12px 12px; border:none; background:transparent; border-radius:16px; font-size:15px; font-weight:700; color:var(--ink); cursor:pointer; text-align:left; min-height:44px;}
  .nav-btn .ic{font-size:20px;}
  .nav-btn.active{background:linear-gradient(135deg,var(--pink),var(--purple)); color:#fff; box-shadow:0 6px 14px rgba(216,140,200,.4);}
  .nav-btn:active{transform:scale(.97);}
  .nav-spacer{flex:1;}
  .nav-foot{font-size:12px; color:#b3a1bd; text-align:center; padding-top:8px; border-top:1px dashed #e7dcec;}
  .main{margin-left:210px; padding:18px 20px 40px; max-width:1100px;}
  .topbar{display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .topbar h1{font-size:22px; margin:0; flex:1; min-width:160px;}
  .stars-pill{background:linear-gradient(135deg,var(--yellow),var(--yellow-d)); color:#7a5b00; font-weight:800; padding:8px 16px; border-radius:999px; box-shadow:0 4px 10px rgba(255,210,63,.4); font-size:16px;}
  .mode-pill{background:linear-gradient(135deg,var(--blue),var(--green)); color:#0a5; font-weight:800; padding:8px 14px; border-radius:999px; font-size:14px; cursor:pointer; border:none; min-height:44px;}
  .card{background:var(--card); border-radius:22px; padding:18px; margin-bottom:16px; box-shadow:0 8px 22px rgba(180,150,200,.14);}
  .card h2{margin:0 0 14px; font-size:18px; display:flex; align-items:center; gap:8px;}
  .card h2 .tag{font-size:12px; font-weight:700; color:#fff; background:var(--purple-d); padding:3px 10px; border-radius:999px;}
  .btn{border:none; border-radius:16px; padding:12px 18px; font-size:16px; font-weight:800; color:#fff; cursor:pointer; background:linear-gradient(135deg,var(--pink-d),var(--purple-d)); box-shadow:0 6px 14px rgba(216,140,200,.35); min-height:44px;}
  .btn:active{transform:scale(.97);}
  .btn.blue{background:linear-gradient(135deg,var(--blue-d),var(--green-d)); box-shadow:0 6px 14px rgba(111,195,255,.35);}
  .btn.yellow{background:linear-gradient(135deg,var(--yellow),var(--yellow-d)); color:#7a5b00; box-shadow:0 6px 14px rgba(255,210,63,.4);}
  .btn.green{background:linear-gradient(135deg,var(--green-d),#5fd6a0); }
  .btn.sm{padding:8px 12px; font-size:14px; min-height:40px;}
  .btn.ghost{background:#f3edf7; color:var(--ink); box-shadow:none;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  label.fld{display:block; font-size:13px; font-weight:700; margin:10px 0 4px; color:#8a7794;}
  input,select,textarea{width:100%; padding:12px 14px; font-size:16px; border:2px solid #efe6f3; border-radius:14px; background:#fff; color:var(--ink); outline:none; min-height:44px; font-family:inherit;}
  input:focus,select:focus,textarea:focus{border-color:var(--purple);}
  .row{display:flex; gap:10px; flex-wrap:wrap;}
  .row>div{flex:1; min-width:120px;}
  .task{display:flex; align-items:center; gap:12px; padding:14px; border-radius:18px; background:#fbf6ff; margin-bottom:10px;}
  .task .tic{font-size:26px; width:42px; text-align:center;}
  .task .tinfo{flex:1;}
  .task .tname{font-weight:800; font-size:16px;}
  .task .tprog{font-size:13px; color:#9a87a5;}
  .task .tstate{font-size:22px;}
  .task.done{background:linear-gradient(135deg,#eafff3,#e7fbff);}
  .item{display:flex; align-items:center; gap:12px; padding:12px; border-radius:16px; background:#fbf6ff; margin-bottom:8px;}
  .item .ic{font-size:24px;}
  .item .body{flex:1; min-width:0;}
  .item .tt{font-weight:700;}
  .item .sub{font-size:13px; color:#9a87a5;}
  .item img.cover{width:46px; height:46px; object-fit:cover; border-radius:10px;}
  .check{width:30px; height:30px; border-radius:50%; border:3px solid var(--green-d); display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; flex:none; background:#fff;}
  .check.on{background:var(--green-d); color:#fff; border-color:var(--green-d);}
  .del{background:#ffe3ee; color:#e0558a; border:none; border-radius:12px; padding:8px 10px; font-weight:800; cursor:pointer; min-height:40px;}
  .badges{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  .badge{text-align:center; padding:12px 6px; border-radius:18px; background:#f6f0fb; border:2px solid #efe6f3;}
  .badge.got{background:linear-gradient(135deg,var(--yellow),var(--pink)); border-color:#ffd23f; box-shadow:0 6px 14px rgba(255,210,63,.35);}
  .badge .bi{font-size:30px; filter:grayscale(1); opacity:.4;}
  .badge.got .bi{filter:none; opacity:1;}
  .badge .bn{font-size:12px; font-weight:700; margin-top:4px;}
  .badge .bd{font-size:10px; color:#a08fb0;}
  .sudoku-wrap{width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; text-align:center;}
  .sudoku{display:grid; gap:3px; background:#d9c7e6; padding:4px; border-radius:12px; width:max-content; margin:10px auto;}
  .sudoku.very9{grid-template-columns:repeat(9,38px);}
  .sudoku.very6{grid-template-columns:repeat(6,46px);}
  .scell{width:38px; height:38px; padding:0; line-height:38px; text-align:center; font-size:18px; font-weight:800; border:none; border-radius:6px; background:#fff; color:var(--ink);}
  .sudoku.very6 .scell{width:46px; height:46px; line-height:46px; font-size:20px;}
  .scell.given{background:#f0e6f7; color:#7a5b9e; cursor:default;}
  .scell.wrong{background:#ffd9e3; color:#e0558a;}
  .sb-border-r{border-right:3px solid #b98cff !important;}
  .sb-border-b{border-bottom:3px solid #b98cff !important;}
  .reward{display:flex; align-items:center; gap:14px; padding:16px; border-radius:18px; background:#fbf6ff; margin-bottom:12px;}
  .reward .ri{font-size:38px;}
  .reward .rbody{flex:1;}
  .reward .rname{font-weight:800; font-size:16px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .child-badge{font-size:11px; font-weight:700; color:#fff; background:linear-gradient(135deg,#ffb347,#ff9a3c); padding:2px 8px; border-radius:999px; white-space:nowrap;}
  .reward .rcost{font-size:13px; color:#9a87a5;}
  .reward .rlim{font-size:12px; color:var(--purple-d); font-weight:700;}
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px;}
  .stat{background:#fbf6ff; border-radius:16px; padding:14px; text-align:center;}
  .stat .sv{font-size:22px; font-weight:800;}
  .stat .sl{font-size:12px; color:#9a87a5; margin-top:2px;}
  .range-btns{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
  .range-btns .btn.ghost.active{background:linear-gradient(135deg,var(--blue),var(--green)); color:#fff;}
  .feed{list-style:none; padding:0; margin:0; max-height:360px; overflow:auto;}
  .feed li{display:flex; gap:10px; align-items:center; padding:10px; border-bottom:1px dashed #eee;}
  .feed .fi{font-size:20px;}
  .feed .ft{flex:1; font-size:14px;}
  .feed .fs{font-weight:800; font-size:14px;}
  .feed .fs.neg{color:#e0558a;}
  .mask{position:fixed; inset:0; background:rgba(90,70,100,.45); display:none; align-items:center; justify-content:center; z-index:60; padding:20px;}
  .mask.show{display:flex;}
  .modal{background:#fff; border-radius:24px; padding:22px; width:100%; max-width:380px; box-shadow:0 20px 50px rgba(0,0,0,.25); max-height:calc(100vh - 40px); overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .modal h3{margin:0 0 14px; text-align:center;}
  .toast{position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:rgba(90,70,100,.92); color:#fff; padding:12px 22px; border-radius:999px; font-weight:700; z-index:90; opacity:0; transition:.3s; pointer-events:none; max-width:90vw; text-align:center;}
  .toast.show{opacity:1; bottom:110px;}
  .hint{font-size:13px; color:#a08fb0; background:#f6f0fb; border-radius:12px; padding:10px 12px; margin-top:10px;}
  .bottom-nav{display:none;}
  @media (max-width:768px){
    .sidebar{display:none;}
    .main{margin-left:0; padding:14px 14px 96px;}
    .bottom-nav{display:flex; position:fixed; left:0; right:0; bottom:0; background:rgba(255,255,255,.95); backdrop-filter:blur(10px); box-shadow:0 -4px 18px rgba(180,150,200,.2); z-index:40; overflow-x:auto; padding:6px 4px; padding-bottom:calc(6px + env(safe-area-inset-bottom));}
    .bottom-nav .nav-btn{flex:none; flex-direction:column; gap:2px; padding:6px 10px; font-size:11px; min-width:58px; border-radius:14px;}
    .bottom-nav .nav-btn .ic{font-size:20px;}
    .badges{grid-template-columns:repeat(2,1fr);}
    .topbar h1{font-size:19px;}
    .sudoku.very9{grid-template-columns:repeat(9,34px);}
    .sudoku.very9 .scell{width:34px; height:34px; line-height:34px; font-size:16px;}
    .mask{padding:10px;}
    .modal{max-height:calc(100vh - 20px); padding:16px; border-radius:18px;}
    .modal h3{font-size:18px;}
    .modal .btn{font-size:15px;}
  }
  /* ===== 成就墙 / 勋章 / 头像 ===== */
  .achieve{background:linear-gradient(135deg,#fff7fb,#f3f8ff);}
  .ach-head{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .ava-wrap{position:relative; width:84px; height:84px; flex:none;}
  .ava-wrap img, .av-default{width:84px; height:84px; border-radius:50%; object-fit:cover; border:4px solid #fff; box-shadow:0 6px 16px rgba(216,140,200,.4); background:linear-gradient(135deg,var(--pink),var(--purple)); display:flex; align-items:center; justify-content:center; font-size:40px; overflow:hidden;}
  .ava-edit{position:absolute; right:-4px; bottom:-4px; border-radius:50%; width:34px; height:34px; padding:0; min-height:34px; font-size:16px;}
  .ach-title{flex:1; min-width:140px;}
  .ach-name{font-size:20px; font-weight:800;}
  .ach-sub{font-size:14px; color:#a08fb0; margin-top:2px;}
  .ach-toys{font-size:22px; letter-spacing:2px; width:100%; text-align:right;}
  .medals{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:16px;}
  .medal{text-align:center;}
  .medal-svg{display:block; margin:0 auto; filter:grayscale(1) opacity(.5);}
  .medal.got .medal-svg{filter:none;}
  .medal-name{font-size:12px; font-weight:700; margin-top:2px; color:#8a7794;}
  .medal.got .medal-name{color:var(--ink);}
  .mini-bar{height:7px; background:#eee; border-radius:99px; margin-top:6px; overflow:hidden;}
  .mini-bar>div{height:100%; background:linear-gradient(135deg,var(--green-d),var(--blue-d)); border-radius:99px; transition:width .3s;}
  @media(max-width:768px){.medals{grid-template-columns:repeat(2,1fr);} }
  /* ===== 音乐乐园周计划 ===== */
  .weekplan{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px;}
  .daychip{flex:none; min-width:78px; background:#fff; border:2px solid #efe6f3; border-radius:14px; padding:10px 8px; text-align:center;}
  .daychip.today{background:linear-gradient(135deg,var(--blue),var(--green)); border-color:var(--green-d); color:#0a5; box-shadow:0 6px 14px rgba(111,195,255,.35);}
  .daychip .dc-d{font-size:12px; font-weight:800;}
  .daychip .dc-t{font-size:11px; color:#9a87a5; margin-top:4px; line-height:1.35;}
  .daychip.today .dc-t{color:#0a5;}
  /* ===== 勋章点亮条件 ===== */
  .medal-cond{font-size:10px; color:#a899b0; margin-top:3px; line-height:1.3; padding:0 2px;}
  .medal.got .medal-cond{color:var(--purple-d);}
  /* ===== 宠物乐园 ===== */
  .pet-card{background:#fff; border:2px solid #f0e6f4; border-radius:18px; padding:14px; margin-bottom:12px; text-align:center;}
  .pet-card .pet-hero{font-size:60px;}
  .pet-bubble{display:inline-block; background:#fff; border:2px solid #ffd6e7; border-radius:14px; padding:7px 12px; margin-bottom:8px; font-size:14px; font-weight:700; color:#c2185b; box-shadow:0 2px 6px rgba(0,0,0,.06); position:relative;}
  .pet-bubble::after{content:''; position:absolute; left:50%; bottom:-8px; transform:translateX(-50%); border:6px solid transparent; border-top-color:#ffd6e7;}
  .timer-box{display:inline-block; background:linear-gradient(135deg,#fff3bf,#ffe066); color:#8a6d00; font-weight:800; font-size:15px; padding:5px 12px; border-radius:20px; box-shadow:0 2px 6px rgba(0,0,0,.08);}
  .pet-opts-title{margin:14px 0 6px; font-size:14px; font-weight:800; color:#8a7794;}
  .pet-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px;}
  .pet-opt{background:#fff; border:2px solid #f0e6f4; border-radius:16px; padding:12px 6px; text-align:center; cursor:pointer; transition:.15s;}
  .pet-opt:active{transform:scale(.96);}
  .pet-emoji{font-size:34px; line-height:1;}
  .pet-nm{font-size:13px; font-weight:800; margin-top:4px; color:#7a6790;}
  .pet-hero{font-size:64px; text-align:center; line-height:1.1; margin:6px 0;}
  .pet-lv{text-align:center; font-size:13px; font-weight:700; color:#7a6790; margin-bottom:4px;}
  @media(max-width:768px){.pet-grid{grid-template-columns:repeat(3,1fr);} }
</style>
</head>

let DB=load();
function load(){ try{const d=JSON.parse(localStorage.getItem(KEY)); if(d){const db=Object.assign({},DEFAULT,d);
  if(d.pet && d.pet.type && !(db.pets&&db.pets.length)){db.pets=[{id:uid(),type:d.pet.type,level:d.pet.level||1,exp:d.pet.exp||0,house:d.pet.house||1}];}
  if(!db.pets)db.pets=[]; if(!db.english)db.english=[];
  db.sync=Object.assign({},DEFAULT.sync, d.sync||{});
  return db;}}catch(e){} return JSON.parse(JSON.stringify(DEFAULT)); }
function saveLocal(){ try{localStorage.setItem(KEY, JSON.stringify(DB));}catch(e){toast('⚠️ 浏览器存储空间不足，录音/照片可能过大，请删减一些记录');} }
function save(){ saveLocal(); scheduleSyncPush(); }

/* ============ 工具 ============ */
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function today(){return ymd(new Date());}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function ym(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function parseD(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
let toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800);}
function addActivity(date,module,detail,stars){DB.activity.push({ts:Date.now(),date,module,detail,stars});}
function addStars(n,module,detail){ DB.stars+=n; DB.starsEarned+=n; addActivity(today(),module,detail,n); checkBadges(); save(); }
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}

function dayStatus(d){
  const hwPending=DB.homework.filter(h=>!h.done && h.due<=d).length;
  const readPages=DB.reading.filter(r=>r.date===d).reduce((s,r)=>s+r.pages,0);
  const exCount=DB.exercise.filter(e=>e.date===d).length;
  const musicMin=DB.music.filter(m=>m.date===d).reduce((s,m)=>s+m.minutes,0);
  const enRead=DB.english.filter(x=>x.type==='read'&&x.date===d).reduce((s,x)=>s+x.minutes,0);
  const enWrite=DB.english.filter(x=>x.type==='write'&&x.date===d).reduce((s,x)=>s+x.minutes,0);
  return {homework:hwPending===0, reading:readPages>=DB.readGoal, exercise:exCount>=1, music:musicMin>=DB.musicGoal, reading_en:enRead>=10, writing_en:enWrite>=10};
}
function fullDays(){
  const set=new Set();
  DB.homework.forEach(h=>{if(h.done&&h.doneDate)set.add(h.doneDate);});
  DB.reading.forEach(r=>set.add(r.date));
  DB.exercise.forEach(e=>set.add(e.date));
  DB.music.forEach(m=>set.add(m.date));
  DB.english.forEach(x=>set.add(x.date));
  let n=0; set.forEach(d=>{const s=dayStatus(d); if(s.homework&&s.reading&&s.exercise&&s.music&&s.reading_en&&s.writing_en)n++;});
  return n;
}

let engRec=null;
function enRecToggle(){
  if(engRec && engRec.recorder && engRec.recorder.state==='recording'){engRec.recorder.stop();return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('本设备不支持直接录音，请用「选录音」上传');return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    const rec=new MediaRecorder(stream);const chunks=[];
    rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
    rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});const fr=new FileReader();
      fr.onload=()=>{const btn=document.querySelector('[data-act="enRec"]');if(btn)btn._audio=fr.result;const st=$('#enRecState');if(st)st.textContent='🎙 已录好一段录音，可以记录啦！';const b2=document.querySelector('[data-act="enRec"]');if(b2)b2.textContent='🎙 录音';toast('录音完成');};
      fr.readAsDataURL(blob);};
    rec.start();engRec={recorder:rec,chunks};
    const btn=document.querySelector('[data-act="enRec"]');if(btn)btn.textContent='⏹ 停止录音';
  }).catch(err=>{toast('无法使用麦克风，请用「选录音」上传');});
}

let quiz=null, sudoku=null;
let sudokuTimer=null, quizTimer=null;
function clearGameTimers(){ if(sudokuTimer){clearInterval(sudokuTimer);sudokuTimer=null;} if(quizTimer){clearInterval(quizTimer);quizTimer=null;} }
function fmtTime(ms){const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function startSudokuTimer(){
  clearInterval(sudokuTimer);
  const el=document.getElementById('sudokuTimer'); if(!el)return;
  const end=sudoku.start+sudoku.limit;
  sudokuTimer=setInterval(()=>{
    const remain=end-Date.now();
    if(remain<=0){clearInterval(sudokuTimer);sudokuTimer=null;sudoku.overtime=true;el.textContent='⏰ 时间到（再完成得基础星）';el.style.color='#e74c3c';return;}
    el.textContent='⏱️ 剩余 '+fmtTime(remain);
  },250);
}
function startQuizTimer(){
  clearInterval(quizTimer);
  const el=document.getElementById('quizTimer'); if(!el)return;
  const end=quiz.start+quiz.limit;
  quizTimer=setInterval(()=>{
    const remain=end-Date.now();
    if(remain<=0){clearInterval(quizTimer);quizTimer=null;quiz.overtime=true;el.textContent='⏰ 时间到（再完成得基础星）';el.style.color='#e74c3c';return;}
    el.textContent='⏱️ 剩余 '+fmtTime(remain);

}

  quiz={probs:[],idx:0,correct:0,start:Date.now(),limit:60000,overtime:false};
  const ops=['+','-','×','÷'];
  for(let i=0;i<10;i++){
    const op=ops[Math.floor(Math.random()*4)]; let a,b,res;
    if(op==='+'){a=rnd(1,99);b=rnd(1,99-a);res=a+b;}
    else if(op==='-'){a=rnd(1,99);b=rnd(1,a);res=a-b;}
    else if(op==='×'){a=rnd(2,9);b=rnd(2,9);res=a*b;}
    else{a=rnd(2,9);b=rnd(2,9);res=a*b;a=res;}

  }

/* ---- 数独生成 ---- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function genFull(n,br,bc){
  const g=Array.from({length:n},()=>Array(n).fill(0));
  function ok(r,c,v){for(let i=0;i<n;i++){if(g[r][i]===v||g[i][c]===v)return false;}const r0=Math.floor(r/br)*br,c0=Math.floor(c/bc)*bc;for(let i=0;i<br;i++)for(let j=0;j<bc;j++)if(g[r0+i][c0+j]===v)return false;return true;}
  function fill(pos){if(pos===n*n)return true;const r=Math.floor(pos/n),c=pos%n;for(const v of shuffle([...Array(n).keys()].map(x=>x+1))){if(ok(r,c,v)){g[r][c]=v;if(fill(pos+1))return true;g[r][c]=0;}}return false;}
  fill(0);return g;
}
function countSol(grid,n,br,bc,limit){
  let cnt=0;
  function solve(){if(cnt>=limit)return;let r=-1,c=-1;outer:for(let i=0;i<n;i++)for(let j=0;j<n;j++){if(grid[i][j]===0){r=i;c=j;break outer;}}
    if(r===-1){cnt++;return;}
    for(let v=1;v<=n;v++){let ok=true;for(let i=0;i<n;i++){if(grid[r][i]===v||grid[i][c]===v){ok=false;break;}}
      if(ok){const r0=Math.floor(r/br)*br,c0=Math.floor(c/bc)*bc;for(let i=0;i<br;i++)for(let j=0;j<bc;j++)if(grid[r0+i][c0+j]===v){ok=false;break;}}
      if(ok){grid[r][c]=v;solve();grid[r][c]=0;if(cnt>=limit)return;}}}
  solve();return cnt;
}
function makePuzzle(n,br,bc,holes){
  const sol=genFull(n,br,bc);const p=sol.map(r=>r.slice());
  for(const idx of shuffle([...Array(n*n).keys()])){if(holes<=0)break;const r=Math.floor(idx/n),c=idx%n;if(p[r][c]===0)continue;const bak=p[r][c];p[r][c]=0;if(countSol(p.map(x=>x.slice()),n,br,bc,2)!==1)p[r][c]=bak;else holes--;}
  return {solution:sol,puzzle:p};
}
function sudokuDailyKey(){ if(!DB.sudokuDaily||DB.sudokuDaily.date!==today()){DB.sudokuDaily={date:today(),count:0};} return DB.sudokuDaily; }
function quizDailyKey(){ if(!DB.quizDaily||DB.quizDaily.date!==today()){DB.quizDaily={date:today(),count:0};} return DB.quizDaily; }
function sudokuNew(size){
  const dk=sudokuDailyKey();
  if(dk.count>=3){toast('今天数独已经玩了 3 次啦，明天再来～');return;}
  dk.count++; save();
  const n=+size; const br=n===6?2:3, bc=3; const holes=n===6?14:46;
  const limit=n===6?120000:300000;
  sudoku={n,br,bc,start:Date.now(),limit,overtime:false,data:makePuzzle(n,br,bc,holes)};
  renderSudoku();
}
function renderSudoku(){
  const {n,br,bc,data}=sudoku;const {puzzle,solution}=data;
  let html=`<div class="sudoku-wrap"><div class="sudoku very${n}" id="sGrid">`;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    const v=puzzle[r][c];const given=v!==0;
    const cls=['scell'];if(given)cls.push('given');if((c+1)%bc===0&&c<n-1)cls.push('sb-border-r');if((r+1)%br===0&&r<n-1)cls.push('sb-border-b');
    html+=`<input class="${cls.join(' ')}" data-r="${r}" data-c="${c}" value="${v?v:''}" ${given?'readonly':''} inputmode="numeric" maxlength="1"/>`;
  }
  html+=`</div></div>
    <div style="text-align:center;margin-top:8px;"><span id="sudokuTimer" class="timer-box">⏱️ 剩余 ${n===6?'2:00':'5:00'}</span></div>
    <div class="row" style="margin-top:10px;">
      <button class="btn green sm" data-act="sudokuCheck">✅ 检查 / 完成</button>
      <button class="btn ghost sm" data-act="sudokuNew" data-size="${n}">🔄 换一题</button>
    </div>
    <div class="hint">完成 ${n}×${n} 数独 ${n===6?'2':'5'} 分钟内可得 ⭐${n===6?2:3}！${n===6?'简单':'困难'}</div>`;
  $('#sudokuBox').innerHTML=html;
  startSudokuTimer();
}
function sudokuCheck(){
  const {n,data}=sudoku;const solution=data.solution;const grid=$('#sGrid');
  let filled=true,allRight=true;
  grid.querySelectorAll('.scell').forEach(inp=>{
    const r=+inp.dataset.r,c=+inp.dataset.c;const v=parseInt(inp.value,10);
    if(isNaN(v)){filled=false;inp.classList.remove('wrong');return;}
    if(v!==solution[r][c]){inp.classList.add('wrong');allRight=false;}else{inp.classList.remove('wrong');}
  });
  if(!filled){toast('还有空格没填哦');return;}
  if(allRight){
    clearInterval(sudokuTimer);sudokuTimer=null;
    const elapsed=(Date.now()-sudoku.start)/1000;

/* ============ 汇总分析 ============ */
let statRange='7';
function inRange(dStr){
  if(statRange==='all')return true;
  const t=parseD(dStr);const now=new Date();
  if(statRange==='month')return dStr.startsWith(ym());
  const cut=new Date(now);cut.setDate(now.getDate()-6);return t>=cut;
}
function ymdate(ymStr){const p=ymStr.split('-');return p[0]+'-'+p[1]+'-01';}
function buildFeed(){
  const items=[];
  DB.homework.filter(h=>h.done&&h.doneDate).forEach(h=>items.push({ts:h.doneTs||0,date:h.doneDate,icon:'📝',text:'完成作业：'+h.text,stars:1}));
  DB.reading.forEach(r=>items.push({ts:r.ts||0,date:r.date,icon:'📚',text:'阅读《'+r.book+'》'+r.pages+'页',stars:1}));
  DB.exercise.forEach(e=>items.push({ts:e.ts||0,date:e.date,icon:'🏃',text:e.type+' '+e.minutes+'分钟',stars:1}));
  DB.music.forEach(m=>{items.push({ts:m.ts||0,date:m.date,icon:'🎵',text:'练琴 '+m.minutes+'分钟'+(m.awarded?'（+⭐2）':''),stars:m.awarded?2:0});});
  DB.english.forEach(e=>{items.push({ts:e.ts||0,date:e.date,icon:e.type==='read'?'🎧':'✍️',text:(e.type==='read'?'听读':'书写')+' '+e.minutes+'分钟'+(e.awarded?'（+⭐1）':''),stars:e.awarded?1:0});});
  DB.practiceLog.forEach(p=>items.push({ts:p.ts,date:p.date,icon:'🎻',text:'练习《'+esc(p.song)+'》',stars:0}));
  DB.quizLog.forEach(q=>items.push({ts:q.ts,date:q.date,icon:'➗',text:'算术练习 答对'+q.correct+'/'+q.problems,stars:q.stars}));
  DB.sudokuLog.forEach(s=>items.push({ts:s.ts,date:s.date,icon:'🔢',text:s.size+'×'+s.size+'数独完成',stars:s.stars}));
  DB.rewards.history.forEach(r=>items.push({ts:r.ts,date:ymdate(r.month),icon:'🎁',text:'兑换'+REWARDS[r.type].name,stars:-r.cost}));
  return items.sort((a,b)=>b.ts-a.ts);
}

  const enR=DB.english.filter(e=>e.type==='read'&&inRange(e.date));

  const grid=stats.map(s=>`<div class="stat"><div class="sv">${s.ic} ${s.v}</div><div class="sl">${s.l}</div></div>`).join('');

  const feed=buildFeed().filter(f=>inRange(f.date)).slice(0,30);

  $('#view').innerHTML=`<div class="card"><h2>📊 汇总分析</h2>

    </div>`;
}

/* ============ 图片压缩 ============ */
function compressImage(file,maxDim){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const img=new Image();img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}else if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      res(c.toDataURL('image/jpeg',0.7));
    };img.onerror=rej;img.src=fr.result;};
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}

let _syncTimer=null, _busy=false;
function syncHeaders(){
  const s=DB.sync; const h={'Content-Type':'application/json'};
  if(s.provider==='gist'){ if(s.token)h['Authorization']='token '+s.token; }
  else { if(s.token)h['Authorization']='Bearer '+s.token; }
  return h;
}
function setSyncStatus(t){const el=document.getElementById('syncStatus'); if(el)el.textContent=t;}
function syncHttpErr(code){
  if(code===401)return '令牌已失效（HTTP 401）：GitHub Token 可能被撤销或过期了。请在云同步里重新填写一个【有效且带 gist 权限】的 Token（注意：令牌一旦被你撤销，同步就会失效）。';
  if(code===403)return '没有权限（HTTP 403）：该 Token 缺少 gist 权限，请重新生成并勾选 gist。';
  if(code===404)return '找不到同步空间（HTTP 404）：Gist ID 不对，或该 Gist 已被删除。';
  return 'HTTP '+code;
}
function scheduleSyncPush(){ if(_busy||!DB.sync.enabled||!DB.sync.auto)return; clearTimeout(_syncTimer); _syncTimer=setTimeout(()=>{syncPush();},800); }
async function syncPush(){
  if(_busy)return; const s=DB.sync;
  if(!s.enabled){toast('请先在云同步里保存设置并开启');return;}
  _busy=true;
  try{
    if(s.provider==='gist'){
      if(!s.token||!s.gistId){toast('请填写 Token 和 Gist ID');return;}
      const res=await fetch('https://api.github.com/gists/'+s.gistId,{method:'PATCH',headers:syncHeaders(),body:JSON.stringify({files:{'zaoting.json':{content:JSON.stringify(DB)}}})});
      if(!res.ok)throw new Error(syncHttpErr(res.status));
    } else {
      if(!s.token||!s.customUrl){toast('请填写 Token 和接口地址');return;}
      const res=await fetch(s.customUrl,{method:'PUT',headers:syncHeaders(),body:JSON.stringify(DB)});
      if(!res.ok)throw new Error(syncHttpErr(res.status));
    }
    s.lastSync=Date.now(); saveLocal();
    setSyncStatus('✅ 已上传到云端 '+new Date().toLocaleTimeString());
  }catch(e){ toast('上传失败：'+(e.message||e)); }
  finally{ _busy=false; }
}
async function syncPull(){
  const s=DB.sync; if(!s.enabled){toast('请先开启云同步');return null;}
  let text;
  if(s.provider==='gist'){
    if(!s.token||!s.gistId){toast('请填写 Token 和 Gist ID');return null;}
    const res=await fetch('https://api.github.com/gists/'+s.gistId,{headers:syncHeaders()});
    if(!res.ok)throw new Error(syncHttpErr(res.status));
    const data=await res.json(); const f=data.files&&data.files['zaoting.json']; text=f?f.content:null;
  } else {
    if(!s.token||!s.customUrl){toast('请填写 Token 和接口地址');return null;}
    const res=await fetch(s.customUrl,{headers:syncHeaders()});
    if(!res.ok)throw new Error(syncHttpErr(res.status));
    text=await res.text();
  }
  if(!text){toast('云端还没有数据，请先上传一次');return null;}
  const d=JSON.parse(text); if(!d||!d.homework)throw new Error('格式不对');
  DB=Object.assign({},DEFAULT,d); DB.sync=s; s.lastSync=Date.now(); saveLocal();
  renderNav(); showModule(cur);
  setSyncStatus('✅ 已从云端拉取 '+new Date().toLocaleTimeString());
  return DB;
}
function syncReadForm(){
  const s=DB.sync;
  s.provider=document.getElementById('syncProvider').value;
  s.token=document.getElementById('syncToken').value.trim();
  s.gistId=document.getElementById('syncId').value.trim();
  s.customUrl=document.getElementById('syncUrl').value.trim();
  s.auto=document.getElementById('syncAuto').checked;
}
function syncSave(){
  syncReadForm();
  const s=DB.sync;
  s.enabled=!!(s.token && (s.provider==='gist'?s.gistId:s.customUrl));
  saveLocal(); toast(s.enabled?'云同步已开启 ☁️':'已保存（还需填写完整信息才会开启）');
  if(s.enabled) syncPush();
}
async function syncCreate(){
  syncReadForm();
  const s=DB.sync;
  if(!s.token){toast('请先在上方填写 Token');return;}
  setSyncStatus('正在创建同步空间…');
  try{
    const res=await fetch('https://api.github.com/gists',{method:'POST',headers:syncHeaders(),body:JSON.stringify({public:false,description:'zaoting 学习乐园 云同步',files:{'zaoting.json':{content:JSON.stringify(DB)}}})});
    if(!res.ok)throw new Error(syncHttpErr(res.status));
    const j=await res.json();
    s.gistId=j.id; s.enabled=true; saveLocal();
    const el=document.getElementById('syncId'); if(el)el.value=s.gistId;
    setSyncStatus('✅ 已创建同步空间，Gist ID：'+s.gistId+'（已自动开启并上传）');
    syncPush();
  }catch(e){ setSyncStatus('❌ 创建失败：'+(e.message||e)); }
}
async function syncTest(){
  syncReadForm();
  const s=DB.sync;
  if(s.provider==='gist'){ if(!s.token||!s.gistId){toast('先填写 Token 和 Gist ID');return;} }
  else { if(!s.token||!s.customUrl){toast('先填写 Token 和接口地址');return;} }
  setSyncStatus('测试中…');
  try{
    if(s.provider==='gist'){ const res=await fetch('https://api.github.com/gists/'+s.gistId,{headers:syncHeaders()}); if(!res.ok)throw new Error(syncHttpErr(res.status)); }
    else { const res=await fetch(s.customUrl,{headers:syncHeaders()}); if(!res.ok)throw new Error(syncHttpErr(res.status)); }
    setSyncStatus('✅ 连接成功，可以读取');
  }catch(e){ setSyncStatus('❌ 连接失败：'+(e.message||e)); }
}


/* ============ 事件 ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el)return;

  else if(act==='hwAddItem'){
    const box=document.getElementById('hwItems');if(!box)return;
    const wrap=document.createElement('div');wrap.className='hw-item';wrap.style.cssText='display:flex;gap:8px;margin-top:6px;';
    wrap.innerHTML='<input class="hwText" style="flex:1" placeholder="例如：数学练习册第5页"/><button class="btn ghost sm" data-act="hwRmItem" type="button">✕</button>';
    box.appendChild(wrap);
  }
  else if(act==='hwRmItem'){const it=e.target.closest('.hw-item');if(it)it.remove();}
  else if(act==='hwAdd'){
    const due=$('#hwDue').value||today();
    const inputs=document.querySelectorAll('#hwItems .hwText');
    let added=0;
    inputs.forEach(inp=>{const t=inp.value.trim();if(t){DB.homework.push({id:uid(),text:t,due,done:false,doneDate:null});added++;}});
    if(!added){toast('先写点作业内容吧');return;}
    save();renderHomework();toast('已添加 '+added+' 项作业 📝');
  }
  else if(act==='hwDone'){const h=DB.homework.find(x=>x.id===id);if(h){const was=h.done;h.done=!h.done;h.doneDate=h.done?today():null;h.doneTs=Date.now();if(h.done){DB.stars+=1;DB.starsEarned+=1;addActivity(today(),'校内作业','完成：'+h.text,1);checkBadges();}else if(was){DB.stars=Math.max(0,DB.stars-1);addActivity(today(),'校内作业','撤回完成：'+h.text,-1);}save();renderNav();showModule(cur);}}
  else if(act==='hwDel'){DB.homework=DB.homework.filter(x=>x.id!==id);save();renderHomework();}
  else if(act==='rdSnap'){$('#rdFile').setAttribute('capture','environment');$('#rdFile').click();}
  else if(act==='rdPick'){$('#rdFile').removeAttribute('capture');$('#rdFile').click();}
  else if(act==='rdAdd'){const b=$('#rdBook').value.trim(),p=parseInt($('#rdPages').value,10);if(!b||!p){toast('书名和页数都要填哦');return;}const cover=el._cover||null;DB.reading.push({id:uid(),book:b,pages:p,cover,date:today(),ts:Date.now()});el._cover=null;addStars(1,'阅读乐园','阅读《'+b+'》'+p+'页');save();renderReading();toast('阅读已记录 +⭐1 📚');}
  else if(act==='rdDel'){DB.reading=DB.reading.filter(x=>x.id!==id);save();renderReading();}
  else if(act==='quizStart'){quizStart();}
  else if(act==='quizSubmit'){quizSubmit();}
  else if(act==='sudokuNew'){sudokuNew(size);}
  else if(act==='sudokuCheck'){sudokuCheck();}
  else if(act==='exAdd'){const t=$('#exType').value,mn=parseInt($('#exMin').value,10);if(!mn){toast('填写运动时长');return;}DB.exercise.push({id:uid(),type:t,minutes:mn,date:today(),ts:Date.now()});addStars(1,'运动乐园',t+' '+mn+'分钟');save();renderNav();renderExercise();toast('运动打卡 +⭐1');}
  else if(act==='exDel'){DB.exercise=DB.exercise.filter(x=>x.id!==id);save();renderExercise();}
  else if(act==='muAdd'){const mn=parseInt($('#muMin').value,10);if(!mn){toast('填写练琴时长');return;}DB.music.push({id:uid(),minutes:mn,date:today(),ts:Date.now(),awarded:false});const tMin=DB.music.filter(m=>m.date===today()).reduce((s,m)=>s+m.minutes,0);const got=DB.music.some(m=>m.date===today()&&m.awarded);if(tMin>=DB.musicGoal&&!got){const rec=DB.music.find(m=>m.date===today()&&!m.awarded);if(rec)rec.awarded=true;addStars(2,'音乐乐园','练琴满'+tMin+'分钟');toast('练琴满30分钟 +⭐2');}else{save();toast('已记录练琴（满30分钟得⭐2）');}renderNav();renderMusic();}
  else if(act==='muDel'){DB.music=DB.music.filter(x=>x.id!==id);save();renderMusic();}
  else if(act==='planAdd'){const ds=$('#plDate').value||today();const n=$('#plSong').value.trim();const g=parseInt($('#plNeed').value,10)||1;if(!n){toast('填好曲目名称哦');return;}DB.plan.push({id:uid(),date:ds,song:n,need:g,awarded:false});save();renderMusic();toast('已添加任务 🎵');}
  else if(act==='practice'){const name=el.dataset.song;if(!name)return;DB.practiceLog.push({id:uid(),song:name,date:today(),ts:Date.now()});const out=outstanding(name);if(out===0){const s=DB.plan.find(t=>t.song===name);if(s&&!s.awarded){s.awarded=true;toast('🏆 《'+name+'》全部练完！');}else{toast('练习完成');}}else{toast('练习完成');}renderNav();renderMusic();}
  else if(act==='practiceUndo'){const name=el.dataset.song;if(!name)return;const arr=DB.practiceLog.filter(p=>p.song===name).sort((a,b)=>b.ts-a.ts);if(!arr.length){toast('没有可撤销的练习');return;}const last=arr[0];DB.practiceLog=DB.practiceLog.filter(p=>p.id!==last.id);const s=DB.plan.find(t=>t.song===name);if(s&&outstanding(name)>0)s.awarded=false;save();renderMusic();toast('已撤销一次练习 ↩');}
  else if(act==='planDel'){const name=el.dataset.song;if(!name)return;DB.plan=DB.plan.filter(t=>t.song!==name);save();renderMusic();toast('已删除该曲目计划');}
  else if(act==='setAvatar'){const f=$('#avatarFile');if(f)f.click();}
  else if(act==='redeem'){redeem(type);}
  else if(act==='adoptPet'){petAdopt(el.dataset.type);}
  else if(act==='petTalk'){petTalk(el.dataset.pid);}
  else if(act==='petFeed'){petFeed(el.dataset.pid);}
  else if(act==='petToy'){petToy(el.dataset.pid);}
  else if(act==='petHouse'){petHouse(el.dataset.pid);}
  else if(act==='petRelease'){petRelease(el.dataset.pid);}
  else if(act==='enRec'){enRecToggle();}
  else if(act==='enRecFile'){$('#enAudioFile').click();}
  else if(act==='enReadAdd'){enReadAdd();}
  else if(act==='enSnap'){$('#enImgFile').setAttribute('capture','environment');$('#enImgFile').click();}
  else if(act==='enPick'){$('#enImgFile').removeAttribute('capture');$('#enImgFile').click();}
  else if(act==='enWriteAdd'){enWriteAdd();}
  else if(act==='engDel'){DB.english=DB.english.filter(x=>x.id!==id);save();renderEnglish();}
  else if(act==='range'){statRange=r;renderStats();}
  else if(act==='modeBtn'){} // handled separately
  else if(act==='savePass'){const p=$('#pParent').value, c=$('#pChild').value;if(!/^\d{4}$/.test(p)||!/^\d{4}$/.test(c)){toast('请输入4位数字密码（家长和孩子各4位）');return;}DB.pass={parent:p,child:c};DB.mode='child';save();closeModal();renderNav();toast('密码已设置，开始吧！');}
  else if(act==='doMode'){doMode(to);}
  else if(act==='dataMgmt'){openDataMgmt();}
  else if(act==='exportData'){exportData();}
  else if(act==='importData'){importData();}
  else if(act==='clearData'){clearData();}
  else if(act==='syncSave'){syncSave();}
  else if(act==='syncCreate'){syncCreate();}
  else if(act==='syncTest'){syncTest();}
  else if(act==='syncPush'){syncReadForm();syncPush();}
  else if(act==='syncPull'){syncReadForm();syncPull();}
  else if(act==='closeModal'){closeModal();}
});
document.addEventListener('change',async e=>{
  if(e.target.id==='rdFile'){
    const file=e.target.files[0];if(!file)return;
    try{const data=await compressImage(file,800);
      const btn=document.querySelector('[data-act="rdAdd"]');if(btn)btn._cover=data;
      toast('封面已添加 📷');
    }catch(err){toast('图片读取失败');}
    e.target.value='';
  } else if(e.target.id==='avatarFile'){
    const file=e.target.files[0];if(!file)return;
    try{const data=await compressImage(file,400);
      DB.avatar=data; save(); renderHome(); toast('头像已更新 🌟');
    }catch(err){toast('图片读取失败');}
    e.target.value='';
  } else if(e.target.id==='enAudioFile'){
    const file=e.target.files[0];if(!file)return;
    try{const rd=new FileReader();rd.onload=()=>{const btn=document.querySelector('[data-act="enRec"]');if(btn)btn._audio=rd.result;const st=$('#enRecState');if(st)st.textContent='🎙 已选择录音文件，可以记录啦！';toast('录音已添加');};rd.readAsDataURL(file);}
    catch(err){toast('录音读取失败');}
    e.target.value='';
  } else if(e.target.id==='enImgFile'){
    const file=e.target.files[0];if(!file)return;
    try{const data=await compressImage(file,800);const btn=document.querySelector('[data-act="enWriteAdd"]');if(btn)btn._cover=data;toast('照片已添加 📷');}
    catch(err){toast('图片读取失败');}
    e.target.value='';
  }
});
$('#modeBtn').addEventListener('click',()=>{ if(!DB.pass.parent) openModeSetup(); else openModeSwitch(); });
$('#mask').addEventListener('click',e=>{ if(e.target.id==='mask') closeModal(); });

/* ============ 启动 ============ */
async function boot(){
  if(DB.sync.enabled){
    try{ await syncPull(); }
    catch(e){ console.warn('云同步拉取失败',e); const m=(e&&e.message)||''; if(/401|403|404/.test(m)){ setTimeout(()=>toast('☁️ 云同步未连接：'+(m.length>60?m.slice(0,60)+'…':m)),400); } }
  }
  if(!DB.pass.parent){ openModeSetup(); }
  renderNav();
  showModule('home');
}
boot();
</script>
